<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Comunión</title>
<link rel="icon" href="assets/comunion-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.475.0/dist/umd/lucide.min.js"></script>
<script src="assets/tailwind-config.js"></script>
<link rel="stylesheet" href="assets/styles.css">
<script src="assets/guard.js"></script>
<script type="module" src="assets/auth.js"></script>
</head>
<body class="min-h-screen" data-page="index">
<div id="app"></div>
<script src="assets/guard.js"></script>
<script src="assets/app.js"></script>
<div id="perfil-usuario" class="perfil-container hidden">
  <h2>Mi Perfil</h2>
  
  <div class="avatar-wrapper">
    <!-- Imagen de perfil actual (por defecto o la de Google) -->
    <img id="foto-perfil" src="assets/comunion-logo.png" alt="Foto de perfil">
    
    <!-- Botón superpuesto para cambiar foto -->
    <button id="btn-cambiar-foto" class="btn-editar" aria-label="Cambiar foto de perfil">
      📷 Cambiar Foto
    </button>
    
    <!-- Input oculto para seleccionar el archivo -->
    <input type="file" id="input-foto" accept="image/png, image/jpeg, image/jpg" style="display: none;">
  </div>

  <div class="info-usuario">
    <p id="nombre-usuario">Cargando nombre...</p>
    <p id="email-usuario">Cargando email...</p>
  </div>
</div>
</body>
</html>
