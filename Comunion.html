<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Comunión</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.475.0/dist/umd/lucide.min.js"></script>
<script>
const c=n=>`hsl(var(--${n}) / <alpha-value>)`;
tailwind.config={darkMode:'class',theme:{extend:{colors:{background:c('background'),foreground:c('foreground'),card:c('card'),primary:{DEFAULT:c('primary'),foreground:c('primary-foreground')},secondary:c('secondary'),muted:{DEFAULT:c('muted'),foreground:c('muted-foreground')},accent:{DEFAULT:c('accent'),foreground:c('accent-foreground')},border:c('border'),'chart-3':c('chart-3'),'chart-4':c('chart-4'),'chart-5':c('chart-5')},fontFamily:{display:['"Cormorant Garamond"','ui-serif','Georgia','serif'],body:['"Plus Jakarta Sans"','ui-sans-serif','system-ui','sans-serif']}}}}
</script>
<style>
:root{--background:40 33% 97%;--foreground:15 6% 13%;--card:0 0% 100%;--primary:346 57% 27%;--primary-foreground:40 33% 97%;--secondary:36 19% 92%;--muted:36 19% 92%;--muted-foreground:28 6% 43%;--accent:46 65% 48%;--accent-foreground:15 6% 13%;--border:36 19% 89%;--chart-3:197 37% 24%;--chart-4:43 74% 66%;--chart-5:27 87% 67%;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--background:20 10% 8%;--foreground:40 20% 92%;--card:20 10% 11%;--primary:346 57% 42%;--secondary:20 8% 18%;--muted:20 8% 18%;--muted-foreground:28 8% 62%;--accent:46 60% 55%;--accent-foreground:20 10% 8%;--border:20 8% 20%}}
:root[data-theme="dark"]{--background:20 10% 8%;--foreground:40 20% 92%;--card:20 10% 11%;--primary:346 57% 42%;--secondary:20 8% 18%;--muted:20 8% 18%;--muted-foreground:28 8% 62%;--accent:46 60% 55%;--accent-foreground:20 10% 8%;--border:20 8% 20%}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:hsl(var(--background));color:hsl(var(--foreground));font-family:'Plus Jakarta Sans',system-ui,sans-serif}
*{border-color:hsl(var(--border))}
.prayer-glow{box-shadow:0 0 0 1px hsl(46 65% 48%/.35),0 0 18px 2px hsl(46 65% 48%/.28)}
.prayer-glow-active{box-shadow:0 0 0 1px hsl(46 65% 48%/.7),0 0 26px 6px hsl(46 65% 48%/.45)}
.gold-text{color:hsl(46 65% 38%)}
:root[data-theme="dark"] .gold-text{color:hsl(46 60% 62%)}
.bnav{padding-bottom:calc(.5rem + env(safe-area-inset-bottom,0px))}
.fab{bottom:calc(5rem + env(safe-area-inset-bottom,0px))}
</style>
</head>
<body class="min-h-screen">
<div id="app"></div>
<script>
const dm=matchMedia('(prefers-color-scheme: dark)');
const applyTheme=()=>document.documentElement.classList.toggle('dark',dm.matches);applyTheme();dm.addEventListener('change',applyTheme);

const esc=s=>String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const ic=(n,k='w-4 h-4')=>`<i data-lucide="${n}" class="${k}"></i>`;

const S={page:'home',nav:'inicio',joined:new Set(),comments:false,playing:false,modal:null,tab:'all',q:'',
reflection:{title:'El buen samaritano',ref:'Lucas 10, 25-37',text:'Un hombre bajaba de Jerusalén a Jericó y cayó en manos de unos bandoleros. Un samaritano que iba de camino lo vio, se compadeció, se le acercó y vendó sus heridas. «Anda, y haz tú lo mismo».',content:'El prójimo es aquel que se hace cercano.'},
saint:{name:'San Francisco de Asís',feast:'4 de octubre',patron:'Los animales y el medio ambiente',bio:'Fundador de la Orden Franciscana. Renunció a la riqueza para vivir el Evangelio en pobreza, alegría y fraternidad con toda la creación.'},
prayers:[
{id:1,author:'María Fernanda',cat:'sanacion',text:'Pido oración por la salud de mi mamá, que será operada esta semana. Que el Señor guíe las manos de los médicos.',n:48},
{id:2,author:'Anónimo',cat:'gratitud',text:'Gracias, Señor, por darme trabajo después de meses de espera. Tu providencia nunca falla.',n:31},
{id:3,author:'Carlos Andrés',cat:'familia',text:'Oren por la reconciliación en mi familia. Hace años no nos hablamos y quiero dar el primer paso.',n:67},
{id:4,author:'Lucía',cat:'vocacion',text:'Estoy discerniendo mi vocación y necesito luz para decidir con paz.',n:22}],
testimonies:[{id:1,author:'Juan Pablo',title:'Volví a la Eucaristía',text:'Después de diez años lejos de la Iglesia, una amiga me invitó a una hora santa. Esa noche sentí que Dios nunca dejó de esperarme. Hoy comulgo cada domingo con el corazón en paz.'}],
circles:[
{id:1,name:'Rosario de las 6 p. m.',cat:'rosario',desc:'Rezamos juntos el santo rosario por las intenciones de la comunidad.',time:'6:00 p. m.',n:124,city:'Cali'},
{id:2,name:'Novena a la Virgen',cat:'novena',desc:'Nueve días de oración y meditación con la Madre del Señor.',time:'7:30 p. m.',n:86,city:'Cali'},
{id:3,name:'Adoración nocturna',cat:'adoracion',desc:'Una hora de silencio y adoración ante el Santísimo.',time:'9:00 p. m.',n:52,city:'Palmira'},
{id:4,name:'Jóvenes en oración',cat:'jovenes',desc:'Encuentro semanal de oración, música y comunidad para jóvenes.',time:'Sáb 5:00 p. m.',n:73,city:'Cali'}],
parishes:[
{id:1,name:'Catedral Metropolitana',desc:'Corazón espiritual de la ciudad, frente a la Plaza de Caycedo.',addr:'Cra. 4 #6-60',city:'Cali',mass:'7:00 a. m., 12:00 m., 6:00 p. m.',phone:'+57 602 555 0101'},
{id:2,name:'Iglesia de La Ermita',desc:'Templo neogótico a orillas del río Cali, de gran valor patrimonial.',addr:'Av. Colombia con Cra. 1',city:'Cali',mass:'8:00 a. m., 11:00 a. m., 5:30 p. m.',phone:'+57 602 555 0102'},
{id:3,name:'Parroquia San Antonio',desc:'Comunidad acogedora con grupos de oración y catequesis.',addr:'Cll. 2 Oeste #7-30',city:'Cali',mass:'9:00 a. m., 6:30 p. m.',phone:'+57 602 555 0103'}],
acts:[
{id:1,name:'Catequesis de confirmación',cat:'formacion',desc:'Formación para jóvenes y adultos que desean recibir el sacramento.',date:'2026-10-14',time:'6:30 p. m.',parish:'Parroquia San Antonio',addr:'Cll. 2 Oeste #7-30',city:'Cali'},
{id:2,name:'Jornada de caridad',cat:'caridad',desc:'Recolección y entrega de mercados para familias necesitadas.',date:'2026-10-17',time:'8:00 a. m.',parish:'Catedral Metropolitana',addr:'Cra. 4 #6-60',city:'Cali'},
{id:3,name:'Coro parroquial',cat:'musica',desc:'Ensayo abierto para quienes quieran servir con el canto.',date:'2026-10-20',time:'7:00 p. m.',parish:'Iglesia de La Ermita',addr:'Av. Colombia con Cra. 1',city:'Cali'}]};

const catP={sanacion:['Sanación','bg-rose-50 text-rose-700'],gratitud:['Gratitud','bg-amber-50 text-amber-700'],familia:['Familia','bg-sky-50 text-sky-700'],vocacion:['Vocación','bg-violet-50 text-violet-700'],trabajo:['Trabajo','bg-emerald-50 text-emerald-700'],fe:['Fe','bg-indigo-50 text-indigo-700'],otros:['Intención','bg-secondary text-muted-foreground']};
const catC={rosario:'Rosario',novena:'Novena',adoracion:'Adoración',jovenes:'Jóvenes',familia:'Familia',otros:'Comunidad'};
const catA={liturgia:['Liturgia','bg-primary/10 text-primary'],formacion:['Formación','bg-accent/15 text-accent-foreground'],caridad:['Caridad','bg-chart-3/15 text-chart-3'],jovenes:['Jóvenes','bg-chart-4/20 text-chart-4'],musica:['Música','bg-chart-5/20 text-chart-5'],otros:['Otros','bg-secondary text-muted-foreground']};

const logo=(size=40,word=false)=>{let r='',d='';for(let i=0;i<12;i++){const a=i*Math.PI/6;r+=`<line x1="${50+Math.cos(a)*37}" y1="${50+Math.sin(a)*37}" x2="${50+Math.cos(a)*45}" y2="${50+Math.sin(a)*45}" stroke="url(#cg)" stroke-width="2" stroke-linecap="round" opacity="${i%2?.5:.95}"/>`}
for(let i=0;i<8;i++){const a=(i*45-22.5)*Math.PI/180;d+=`<circle cx="${50+Math.cos(a)*33}" cy="${50+Math.sin(a)*33}" r="2.4" fill="url(#cg)"/>`}
return `<div class="flex items-center gap-2.5"><svg width="${size}" height="${size}" viewBox="0 0 100 100" fill="none" role="img" aria-label="Comunión"><defs><linearGradient id="cg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#F0D580"/><stop offset="50%" stop-color="#D4AF37"/><stop offset="100%" stop-color="#B8932E"/></linearGradient><linearGradient id="cb" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#7A2238"/><stop offset="100%" stop-color="#5C1729"/></linearGradient><radialGradient id="cl"><stop offset="0%" stop-color="#D4AF37" stop-opacity=".3"/><stop offset="70%" stop-color="#D4AF37" stop-opacity=".04"/><stop offset="100%" stop-color="#D4AF37" stop-opacity="0"/></radialGradient></defs><circle cx="50" cy="50" r="46" fill="url(#cl)"/>${r}<circle cx="50" cy="50" r="33" stroke="url(#cg)" stroke-width="1.2" opacity=".55"/>${d}<rect x="46.5" y="24" width="7" height="52" rx="2" fill="url(#cb)" stroke="url(#cg)" stroke-width=".5"/><rect x="30" y="38.5" width="40" height="7" rx="2" fill="url(#cb)" stroke="url(#cg)" stroke-width=".5"/></svg>${word?'<span class="font-display text-2xl font-semibold text-foreground leading-none">Comunión</span>':''}</div>`};

const items=[['inicio','Inicio','home'],['oraciones','Oraciones','hand'],['comunidad','Comunidad','users'],['directorio','Directorio','map-pin'],['perfil','Perfil','user']];
const navHtml=()=>`<aside class="hidden lg:flex flex-col w-60 shrink-0 border-r bg-card/40 sticky top-0 h-screen px-4 py-6"><div class="px-2 mb-8">${logo(40,true)}</div><nav class="flex flex-col gap-1">${items.map(([id,l,i])=>`<button data-nav="${id}" class="flex items-center gap-3 px-4 py-2.5 rounded-full text-sm font-medium transition ${S.nav===id?'bg-primary text-primary-foreground':'text-muted-foreground hover:bg-secondary hover:text-foreground'}">${ic(i,'w-5 h-5')}${l}</button>`).join('')}</nav><div class="mt-auto px-2"><p class="font-display text-lg gold-text leading-snug">«Orad unos por otros»</p><p class="text-xs text-muted-foreground mt-1">Santiago 5, 16</p></div></aside>
<nav class="bnav lg:hidden fixed bottom-0 inset-x-0 z-40 bg-card/95 backdrop-blur border-t flex justify-around pt-2 px-2">${items.map(([id,l,i])=>`<button data-nav="${id}" class="flex flex-col items-center gap-1 px-3 py-1.5 rounded-full text-xs font-medium ${S.nav===id?'text-primary':'text-muted-foreground'}">${ic(i,'w-5 h-5')}${l}</button>`).join('')}</nav>`;

const prayerCard=p=>{const [lb,st]=catP[p.cat]||catP.otros,j=S.joined.has(p.id);return `<article class="bg-card rounded-2xl border p-5"><div class="flex items-center gap-3 mb-3"><div class="w-10 h-10 rounded-full bg-secondary flex items-center justify-center text-primary font-display text-lg">${esc(p.author[0].toUpperCase())}</div><div class="flex-1 min-w-0"><p class="text-sm font-semibold truncate">${esc(p.author)}</p><span class="inline-block mt-0.5 text-xs px-2 py-0.5 rounded-full ${st}">${lb}</span></div></div><p class="text-base leading-relaxed whitespace-pre-wrap">${esc(p.text)}</p><div class="flex items-center justify-between mt-4 pt-4 border-t"><span class="text-sm text-muted-foreground"><span class="font-display text-xl gold-text">${p.n}</span> personas orando</span><button data-join="${p.id}" ${j?'disabled':''} class="inline-flex items-center gap-2 rounded-full px-5 py-2.5 text-sm font-semibold transition ${j?'bg-accent/20 text-accent-foreground prayer-glow-active':'bg-primary text-primary-foreground hover:bg-primary/90 prayer-glow'}">${j?ic('check')+' Unido en oración':ic('hand')+' Unirme en oración'}</button></div></article>`};
const testCard=t=>`<article class="bg-card rounded-2xl border p-5"><div class="flex items-center gap-3 mb-3"><div class="w-10 h-10 rounded-full bg-accent/15 flex items-center justify-center text-accent-foreground">${ic('sparkles','w-5 h-5')}</div><div class="flex-1 min-w-0"><p class="text-sm font-semibold truncate">${esc(t.author)}</p><span class="inline-block mt-0.5 text-xs px-2 py-0.5 rounded-full bg-accent/15 text-accent-foreground">Testimonio</span></div></div><h3 class="font-display text-xl leading-snug">${esc(t.title)}</h3><p class="text-foreground/80 text-base mt-2 leading-relaxed whitespace-pre-wrap">${esc(t.text)}</p></article>`;
const circleCard=x=>`<div class="bg-card rounded-2xl border p-4"><div class="flex items-start justify-between gap-2"><div class="min-w-0"><span class="text-xs px-2 py-0.5 rounded-full bg-secondary text-muted-foreground">${catC[x.cat]||'Comunidad'}</span><h4 class="font-display text-lg mt-1.5 leading-tight">${esc(x.name)}</h4></div><div class="w-9 h-9 rounded-full bg-primary/10 flex items-center justify-center text-primary shrink-0">${ic('users')}</div></div><p class="text-sm text-muted-foreground mt-2">${esc(x.desc)}</p><div class="flex items-center justify-between mt-3 pt-3 border-t"><span class="text-xs text-muted-foreground flex items-center gap-1.5">${ic('clock','w-3.5 h-3.5')} ${esc(x.time)} · ${x.n} miembros</span><button data-circ="${x.id}" class="text-xs font-semibold text-primary hover:underline">Unirse</button></div></div>`;
const saintCard=s=>`<div class="bg-card rounded-2xl border overflow-hidden"><div class="h-40 bg-secondary flex items-center justify-center text-accent font-display text-6xl">✝</div><div class="p-4"><p class="text-xs uppercase tracking-wider gold-text font-semibold">Santo del día</p><h3 class="font-display text-2xl mt-1 leading-tight">${s.name}</h3><p class="text-sm text-muted-foreground">${s.feast}</p><p class="text-sm text-muted-foreground mt-1">Patrono: ${s.patron}</p><p class="text-sm text-foreground/80 mt-2">${s.bio}</p></div></div>`;
const parishCard=p=>`<div class="bg-card rounded-2xl border overflow-hidden"><div class="h-40 bg-secondary flex items-center justify-center text-accent font-display text-6xl">⛪</div><div class="p-4"><h3 class="font-display text-lg leading-tight">${p.name}</h3><p class="text-sm text-muted-foreground mt-1">${p.desc}</p><p class="text-xs text-muted-foreground mt-2 flex items-start gap-1.5">${ic('map-pin','w-3.5 h-3.5 mt-0.5 shrink-0')}<span>${p.addr}, ${p.city}</span></p><p class="text-xs text-muted-foreground mt-1.5 flex items-center gap-1.5">${ic('clock','w-3.5 h-3.5 shrink-0')}<span>Misas: ${p.mass}</span></p><p class="text-xs text-muted-foreground mt-1.5 flex items-center gap-1.5">${ic('phone','w-3.5 h-3.5 shrink-0')}<span>${p.phone}</span></p></div></div>`;
const actCard=a=>{const [lb,st]=catA[a.cat]||catA.otros;const d=new Date(a.date+'T12:00').toLocaleDateString('es-CO',{day:'numeric',month:'short'});return `<div class="bg-card rounded-2xl border p-4"><span class="text-xs px-2 py-0.5 rounded-full ${st}">${lb}</span><h3 class="font-display text-lg mt-1.5 leading-tight">${a.name}</h3><p class="text-sm text-muted-foreground mt-2">${a.desc}</p><div class="flex flex-wrap gap-x-4 gap-y-1 mt-3 text-xs text-muted-foreground"><span class="flex items-center gap-1.5">${ic('calendar','w-3.5 h-3.5')}${d}</span><span class="flex items-center gap-1.5">${ic('clock','w-3.5 h-3.5')}${a.time}</span></div><p class="text-xs text-muted-foreground mt-1.5 flex items-start gap-1.5">${ic('map-pin','w-3.5 h-3.5 mt-0.5 shrink-0')}<span><span class="font-medium">${a.parish} · </span>${a.addr}, ${a.city}</span></p></div>`};

const hero=()=>{const r=S.reflection;return `<section class="relative overflow-hidden rounded-2xl p-6 sm:p-8" style="background:radial-gradient(130% 120% at 0% 0%,hsl(346 57% 27%),hsl(346 57% 18%) 72%)"><div class="absolute -right-6 -top-10 text-[11rem] leading-none text-accent/15 font-display select-none pointer-events-none">✝</div><div class="relative"><span class="inline-flex items-center gap-1.5 text-xs font-semibold uppercase tracking-wider text-accent"><span class="w-1.5 h-1.5 rounded-full bg-accent"></span> Evangelio del día</span><h2 class="font-display text-3xl sm:text-4xl text-white mt-3 leading-tight">${r.title}</h2><p class="text-accent/90 text-sm mt-1">${r.ref}</p><p class="text-white/80 text-base mt-4 leading-relaxed">${r.text}</p><div class="flex flex-wrap items-center gap-3 mt-6"><button data-act="speak" class="inline-flex items-center gap-2 rounded-full bg-accent text-accent-foreground px-5 py-2.5 text-sm font-semibold hover:opacity-90 transition">${ic(S.playing?'pause':'play')} ${S.playing?'Pausar':'Escuchar'}</button><button data-act="comments" class="inline-flex items-center gap-2 rounded-full border border-white/30 text-white px-5 py-2.5 text-sm font-semibold hover:bg-white/10 transition">${ic('message-square')} Comentar Reflexión</button></div></div></section>`};
const comments=()=>S.comments?`<div class="mt-4 bg-card rounded-2xl border p-4"><h3 class="font-display text-lg mb-3">Comentarios</h3><div class="space-y-3 mb-3">${(S.cm||[]).map(c=>`<p class="text-sm"><span class="font-semibold">Tú</span> · ${esc(c)}</p>`).join('')||'<p class="text-sm text-muted-foreground">Aún no hay comentarios.</p>'}</div><div class="flex gap-2"><input id="cin" class="flex-1 h-10 rounded-md border bg-transparent px-3 text-sm" placeholder="Escribe tu reflexión..."><button data-act="addc" class="rounded-full bg-primary text-primary-foreground px-4 text-sm font-semibold">Enviar</button></div></div>`:'';

const quick=(a,i,t,cls)=>`<button data-open="${a}" class="flex flex-col items-center gap-1.5 bg-card border rounded-2xl p-3 hover:border-primary/30 transition"><span class="w-9 h-9 rounded-full ${cls} flex items-center justify-center">${ic(i)}</span><span class="text-xs font-medium">${t}</span></button>`;
const circlesBlock=()=>S.circles.map(circleCard).join('<div class="h-3"></div>');
const feed=()=>[...S.prayers.map(p=>({...p,_t:'p'})),...S.testimonies.map(t=>({...t,_t:'t'}))].sort((a,b)=>b.id*(b._t=='p'?1:1)-a.id*1);

const home=()=>`<div class="flex-1 min-w-0 flex justify-center"><div class="w-full max-w-6xl lg:flex lg:gap-8 lg:px-6 lg:py-6 px-4 py-4"><main class="flex-1 min-w-0 max-w-[680px] mx-auto lg:mx-0 pb-24 lg:pb-8"><div class="lg:hidden flex items-center justify-between mb-4">${logo(36,true)}<span class="text-xs px-3 py-1 rounded-full bg-secondary text-muted-foreground">«Dad gracias al Señor»</span></div>${hero()}${comments()}<div class="grid grid-cols-3 gap-3 mt-5">${quick('prayer','hand','Pedir Oración','bg-primary/10 text-primary')}${quick('testimony','sparkles','Testimonio','bg-accent/15 text-accent-foreground')}${quick('circle','plus','Iniciar Rosario','bg-primary/10 text-primary')}</div><div id="feed" class="mt-6 space-y-4 scroll-mt-4"><h2 class="font-display text-xl">Muro de intenciones</h2>${S.prayers.map(prayerCard).join('')}${S.testimonies.map(testCard).join('')}</div><div class="lg:hidden mt-8 space-y-6" id="circles-m"><div><h2 class="font-display text-xl mb-3">Círculos de oración</h2>${circlesBlock()}</div>${saintCard(S.saint)}</div></main><aside class="hidden lg:block w-80 shrink-0 space-y-6"><div id="circles" class="scroll-mt-4"><h2 class="font-display text-xl mb-3">Círculos activos</h2>${circlesBlock()}</div>${saintCard(S.saint)}<div class="bg-card rounded-2xl border p-4"><h3 class="font-display text-lg mb-2">Intenciones de hoy</h3><p class="text-sm text-muted-foreground">«Orad unos por otros, para que seáis sanados.»</p><p class="text-xs text-muted-foreground mt-1">Santiago 5, 16</p></div></aside></div></div><button data-open="prayer" class="fab lg:hidden fixed right-4 z-40 inline-flex items-center gap-2 rounded-full bg-primary text-primary-foreground px-6 py-3.5 text-sm font-semibold shadow-lg">${ic('hand')} Pedir Oración</button>`;

const m=(t,x)=>!S.q||(t||'').toLowerCase().includes(S.q.toLowerCase());
const dirRes=()=>{const q=S.q,cs=S.circles.filter(c=>m(c.name)||m(c.desc)||m(c.city)),ps=S.parishes.filter(p=>m(p.name)||m(p.desc)||m(p.city)||m(p.addr)),as=S.acts.filter(a=>m(a.name)||m(a.desc)||m(a.parish)),t=S.tab;
const sec=(show,h,i,arr,f,cls)=>show?`<section><h2 class="font-display text-xl mb-3 flex items-center gap-2">${ic(i,'w-5 h-5 text-primary')} ${h}</h2>${arr.length?`<div class="grid sm:grid-cols-2 gap-4">${arr.map(f).join('')}</div>`:'<p class="text-sm text-muted-foreground">No hay resultados que coincidan.</p>'}</section>`:'';
return sec(t=='all'||t=='grupos','Grupos de oración','users',cs,circleCard)+sec(t=='all'||t=='parroquias','Parroquias','church',ps,parishCard)+sec(t=='all'||t=='actividades','Actividades','calendar',as,actCard)};
const dir=()=>`<div class="flex-1 min-w-0 flex justify-center"><div class="w-full max-w-4xl px-4 py-6 lg:py-10 pb-24 lg:pb-10"><div class="lg:hidden mb-4"><h1 class="font-display text-2xl">Directorio</h1></div><div class="hidden lg:block mb-6"><h1 class="font-display text-3xl">Directorio parroquial</h1><p class="text-sm text-muted-foreground mt-1">Busca grupos de oración, parroquias y actividades cercanas a ti.</p></div><div class="flex gap-2 mb-4"><div class="relative flex-1"><span class="absolute left-3 top-1/2 -translate-y-1/2 text-muted-foreground">${ic('search')}</span><input id="q" value="${esc(S.q)}" placeholder="Buscar por nombre, ciudad o dirección..." class="w-full h-10 rounded-md border bg-card pl-9 pr-3 text-sm"></div><button data-act="loc" class="shrink-0 inline-flex items-center gap-2 h-10 px-4 rounded-md bg-primary text-primary-foreground text-sm font-medium">${ic('navigation')}<span class="hidden sm:inline">Cerca de mí</span></button></div><div class="inline-flex rounded-md bg-secondary p-1 mb-5 text-sm">${[['all','Todo'],['grupos','Grupos'],['parroquias','Parroquias'],['actividades','Actividades']].map(([k,l])=>`<button data-tab="${k}" class="px-3 py-1.5 rounded-sm font-medium ${S.tab==k?'bg-card shadow-sm text-foreground':'text-muted-foreground'}">${l}</button>`).join('')}</div><div id="res" class="space-y-8">${dirRes()}</div></div></div>`;

const profile=()=>`<div class="flex-1 min-w-0 flex justify-center"><div class="w-full max-w-2xl px-4 py-6 lg:py-10 pb-24 lg:pb-10"><div class="bg-card rounded-2xl border p-6 text-center"><div class="w-20 h-20 mx-auto rounded-full bg-secondary flex items-center justify-center text-primary font-display text-4xl">I</div><h1 class="font-display text-2xl mt-3">Invitado</h1><p class="text-sm text-muted-foreground">Miembro de la comunidad Comunión</p></div><div class="grid grid-cols-3 gap-3 mt-4">${[['Oraciones',S.joined.size],['Testimonios',S.testimonies.length],['Círculos',S.myc||0]].map(([l,n])=>`<div class="bg-card rounded-2xl border p-4 text-center"><p class="font-display text-3xl gold-text">${n}</p><p class="text-xs text-muted-foreground mt-1">${l}</p></div>`).join('')}</div></div></div>`;

const modal=()=>{if(!S.modal)return '';const k=S.modal,cfg={prayer:['Pedir oración','Tu intención','Publicar intención',0],testimony:['Compartir testimonio','Cuéntanos qué hizo el Señor en tu vida','Publicar testimonio',1],circle:['Iniciar Rosario','Nombre y descripción del círculo','Crear círculo',1]}[k];
return `<div class="fixed inset-0 z-50 bg-black/60 flex items-center justify-center p-4" data-act="close"><div class="bg-card rounded-2xl border w-full max-w-md p-6" onclick="event.stopPropagation()"><h2 class="font-display text-2xl mb-4">${cfg[0]}</h2>${k!='prayer'?'<input id="mt" class="w-full h-10 rounded-md border bg-transparent px-3 text-sm mb-3" placeholder="Título o nombre">':''}<textarea id="mx" rows="4" class="w-full rounded-md border bg-transparent p-3 text-sm" placeholder="${cfg[1]}"></textarea><div class="flex justify-end gap-2 mt-4"><button data-act="close" class="rounded-full border px-5 py-2 text-sm font-medium">Cancelar</button><button data-act="submit" class="rounded-full bg-primary text-primary-foreground px-5 py-2 text-sm font-semibold">${cfg[2]}</button></div></div></div>`};

const toast=t=>{const e=document.createElement('div');e.className='fixed left-1/2 -translate-x-1/2 z-[60] bg-card border rounded-xl shadow-lg px-4 py-3 text-sm font-medium';e.style.bottom='calc(6rem + env(safe-area-inset-bottom,0px))';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2500)};
function render(){const p=S.page;document.getElementById('app').innerHTML=`<div class="min-h-screen flex">${navHtml()}${p=='home'?home():p=='dir'?dir():profile()}</div>${modal()}`;lucide.createIcons()}
function go(id){S.nav=id;if(id=='directorio')S.page='dir';else if(id=='perfil')S.page='perfil';else{S.page='home'}render();if(id=='oraciones')document.getElementById('feed')?.scrollIntoView({behavior:'smooth'});else if(id=='comunidad')(document.getElementById('circles')?.offsetParent?document.getElementById('circles'):document.getElementById('circles-m'))?.scrollIntoView({behavior:'smooth'});else scrollTo({top:0})}

document.addEventListener('click',e=>{const t=e.target.closest('[data-nav],[data-join],[data-circ],[data-open],[data-act],[data-tab]');if(!t)return;const d=t.dataset;
if(d.nav)return go(d.nav);
if(d.join){const p=S.prayers.find(x=>x.id==d.join);if(!S.joined.has(p.id)){S.joined.add(p.id);p.n++;render()}return}
if(d.circ){const c=S.circles.find(x=>x.id==d.circ);c.n++;S.myc=(S.myc||0)+1;render();return toast('Te uniste al círculo: '+c.name)}
if(d.open){S.modal=d.open;render();return}
if(d.tab){S.tab=d.tab;render();return}
if(d.act=='close'){S.modal=null;render()}
if(d.act=='comments'){S.comments=!S.comments;render()}
if(d.act=='addc'){const v=document.getElementById('cin').value.trim();if(v){(S.cm=S.cm||[]).push(v);render()}}
if(d.act=='speak'){if(!('speechSynthesis' in window)){S.comments=true;return render()}if(S.playing){speechSynthesis.cancel();S.playing=false}else{const u=new SpeechSynthesisUtterance(S.reflection.title+'. '+S.reflection.text);u.lang='es-ES';u.onend=u.onerror=()=>{S.playing=false;render()};speechSynthesis.speak(u);S.playing=true}render()}
if(d.act=='loc')toast('Ubicación disponible solo en la app instalada')
if(d.act=='submit'){const x=document.getElementById('mx').value.trim(),ti=document.getElementById('mt')?.value.trim(),k=S.modal;if(!x)return;const id=Date.now();
if(k=='prayer')S.prayers.unshift({id,author:'Invitado',cat:'otros',text:x,n:0});
if(k=='testimony')S.testimonies.unshift({id,author:'Invitado',title:ti||'Mi testimonio',text:x});
if(k=='circle')S.circles.unshift({id,name:ti||'Nuevo rosario',cat:'rosario',desc:x,time:'Por definir',n:1,city:''});
S.modal=null;render();toast('Publicado en la comunidad')}});
document.addEventListener('input',e=>{if(e.target.id=='q'){S.q=e.target.value;document.getElementById('res').innerHTML=dirRes();lucide.createIcons()}});
render();
</script>
</body>
</html>
